<header class="site-header">
  <div class="site-header__inner container">
    <a class="site-header__brand" routerLink="/" (click)="closeMenu()">{{ profile.name }}</a>

    <nav class="site-header__navigation" aria-label="Primary">
      @for (item of navigationItems; track item.path) {
        <a
          class="site-header__navigation-link"
          [routerLink]="item.path"
          routerLinkActive="site-header__navigation-link--active"
          ariaCurrentWhenActive="page"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <app-theme-toggle />

    <a
      class="site-header__cv-action site-header__cv-action--desktop"
      routerLink="/cv"
      routerLinkActive="site-header__cv-action--active"
      ariaCurrentWhenActive="page"
    >
      <span class="site-header__cv-action-prefix">Download </span>CV
    </a>

    <button
      #menuTrigger
      class="site-header__menu-trigger"
      type="button"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="isMenuOpen() ? 'Close navigation' : 'Open navigation'"
      (click)="toggleMenu()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24">
        @if (isMenuOpen()) {
          <path d="M6 6l12 12M18 6 6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
  </div>

  @if (isMenuOpen()) {
    <nav
      id="mobile-navigation"
      class="site-header__mobile-navigation container"
      aria-label="Mobile"
    >
      @for (item of navigationItems; track item.path) {
        <a
          class="site-header__mobile-navigation-link"
          [routerLink]="item.path"
          routerLinkActive="site-header__mobile-navigation-link--active"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }

      <a
        class="site-header__cv-action site-header__cv-action--mobile"
        routerLink="/cv"
        routerLinkActive="site-header__cv-action--active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        Download CV
      </a>
    </nav>
  }
</header>
