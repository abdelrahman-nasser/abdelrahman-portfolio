<footer class="site-footer">
  <div class="site-footer__inner container">
    <div class="site-footer__identity">
      <a class="site-footer__brand" routerLink="/">Abdelrahman Hegab</a>
      <p>Senior Software Engineer</p>
    </div>

    <nav aria-label="Footer">
      <ul class="site-footer__links" role="list">
        @for (link of internalLinks; track link.url) {
          <li>
            <a [routerLink]="link.url">{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <ul class="site-footer__links" aria-label="Contact and social profiles" role="list">
      @for (link of profileLinks; track link.url) {
        <li>
          <a
            [href]="link.url"
            [attr.target]="link.url.startsWith('http') ? '_blank' : null"
            rel="noopener noreferrer"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <p class="site-footer__copyright">© Abdelrahman Hegab</p>
  </div>
</footer>
