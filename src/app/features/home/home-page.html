<section class="hero" aria-labelledby="hero-title">
  <app-page-container>
    <div class="hero__layout">
      <div class="hero__content">
        <p class="hero__eyebrow">{{ profile.role }}</p>
        <h1 id="hero-title">{{ profile.name }}</h1>
        <p class="hero__positioning">{{ positioning }}</p>
        <p class="hero__support">{{ profile.supportLine }}</p>

        <div class="hero__actions">
          <a class="hero__action hero__action--primary" routerLink="/projects">View My Work</a>
          <a
            class="hero__action hero__action--secondary"
            [href]="profile.cv.pdfUrl"
            [attr.download]="profile.cv.downloadFileName"
            >Download CV</a
          >
        </div>
      </div>

      <section class="hero-visual" aria-labelledby="engineering-profile-title">
        <div class="hero-visual__header">
          <h2 id="engineering-profile-title">{{ engineeringProfile.heading }}</h2>
          <span>{{ engineeringProfile.label }}</span>
        </div>

        <dl class="hero-visual__flow">
          @for (row of engineeringProfile.rows; track row.number) {
            <div class="hero-visual__node">
              <dt>
                <span aria-hidden="true">{{ row.number }}</span> {{ row.category }}
              </dt>
              <dd>{{ row.value }}</dd>
            </div>
          }
        </dl>
      </section>
    </div>
  </app-page-container>
</section>

<app-professional-snapshot />
<app-selected-work />
<app-experience-preview />
<app-engineering-expertise />
<app-engineering-principles />
<app-ai-engineering />
<app-certifications />
<app-contact-cta />
