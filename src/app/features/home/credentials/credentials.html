<section class="credentials" aria-labelledby="credentials-title">
  <app-page-container>
    <div class="credentials__heading">
      <p class="credentials__eyebrow">Microsoft Certifications</p>
      <h2 id="credentials-title">Credentials</h2>
      <p class="credentials__intro">
        Microsoft certifications earned across web application development and software engineering.
      </p>
    </div>

    <ul class="credentials__list" role="list">
      @for (credential of credentials; track credential.id) {
        <li class="credentials__item">
          <article class="credentials__card">
            <h3 class="credentials__card-title">{{ credential.title }}</h3>
            <p class="credentials__card-issuer">{{ credential.issuer }}</p>
          </article>
        </li>
      }
    </ul>
  </app-page-container>
</section>
