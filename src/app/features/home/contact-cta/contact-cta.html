<section class="contact-cta" aria-labelledby="contact-cta-title">
  <app-page-container>
    <div class="contact-cta__card">
      <div class="contact-cta__content">
        <h2 id="contact-cta-title" class="contact-cta__heading">Let's Work Together</h2>
        <p class="contact-cta__support">{{ supportingCopy }}</p>
      </div>

      <div class="contact-cta__actions">
        <a class="contact-cta__action contact-cta__action--primary" routerLink="/contact">
          Contact Me
        </a>
        <a class="contact-cta__action contact-cta__action--secondary" routerLink="/cv"> View CV </a>
      </div>
    </div>
  </app-page-container>
</section>
