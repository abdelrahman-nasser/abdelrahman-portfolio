<article
  class="project-card"
  [class.project-card--featured]="project().featured"
  [class.project-card--standard]="!project().featured"
>
  <div class="project-card__content">
    @if (project().featured) {
      <p class="project-card__featured-label">Featured Project</p>
    }

    <p class="project-card__subtitle">{{ project().subtitle }}</p>
    <h3>{{ project().title }}</h3>
    <p class="project-card__summary">{{ project().summary }}</p>

    <ul class="project-card__tags" [attr.aria-label]="project().title + ' technologies'">
      @for (tag of project().tags; track tag) {
        <li>{{ tag }}</li>
      }
    </ul>
  </div>

  <a
    class="project-card__link"
    [routerLink]="project().route"
    [attr.aria-label]="'View ' + project().title + ' case study'"
  >
    <span>View case study</span>
    <span class="project-card__link-indicator" aria-hidden="true">&rarr;</span>
  </a>
</article>
