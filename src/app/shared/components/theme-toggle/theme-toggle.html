<div class="theme-toggle">
  <button
    #trigger
    class="theme-toggle__trigger"
    type="button"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="'Theme: ' + currentPreferenceLabel() + '. Choose theme.'"
    (click)="toggleMenu()"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor" />
    </svg>
  </button>

  @if (isOpen()) {
    <div class="theme-toggle__options" role="group" aria-label="Choose theme">
      @for (option of options; track option.value) {
        <button
          class="theme-toggle__option"
          type="button"
          [attr.aria-pressed]="theme.preference() === option.value"
          (click)="selectTheme(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
